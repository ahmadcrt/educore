<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | EDUCORE</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth">
<form id="register-form" novalidate><a class="logo" style="color:var(--navy)" href="index.html">EDU<span>CORE</span></a><h1 style="font-size:1.5rem">Create account</h1><label>Full name<input name="name" required autocomplete="name"></label>
<label>Email<input id="email" name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
<div id="msg" class="msg" role="alert"></div><button class="btn">Create account</button><p class="meta">Have an account? <a href="login.html">Log in</a></p></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></body></html>
